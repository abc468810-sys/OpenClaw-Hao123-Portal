name: Build AI OS Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build
        run: |
          npm run build

      - name: Upload generated pages
        uses: actions/upload-artifact@v4
        with:
          name: generated-h5
          path: generated-h5/
